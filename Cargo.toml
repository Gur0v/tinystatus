[package]
name = "tinystatus"
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
description = "A plain-text status line for Sway and X11"
license-file = "LICENSE"
repository = "https://github.com/Gur0v/tinystatus"

[dependencies]
libc = "0.2"
libpulse-sys = { version = "1", default-features = false }
serde_json = "1"
x11rb = { version = "0.14.0", features = ["xkb"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
overflow-checks = true
strip = true
